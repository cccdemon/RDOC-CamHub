name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: camhub
          POSTGRES_PASSWORD: camhub
          POSTGRES_DB: camhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U camhub -d camhub"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: go test
        env:
          CAMHUB_DB_URL: postgres://camhub:camhub@localhost:5432/camhub?sslmode=disable
          CAMHUB_SESSION_KEY: "test-key-must-be-at-least-32-bytes-long!!"
        run: go test -race -count=1 ./...

  build-image:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: rdoc-camhub:ci
