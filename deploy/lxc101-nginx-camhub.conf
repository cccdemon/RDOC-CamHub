# LXC 101 (proxy) nginx — SNI route for camhub.raumdock.org subdomains.
#
# This is a *patch*, not a standalone file. LXC 101 has a single top-level
# `stream { ... }` block in /etc/nginx/stream.d/minecraft.raumdock.org.conf
# (the file is the central stream-proxy config; the name is historical).
# nginx only allows one `stream {}` block, so we extend that file in place.
#
# Apply on LXC 101 (as root):
#
#   1. vi /etc/nginx/stream.d/minecraft.raumdock.org.conf
#   2. Inside the existing `map $ssl_preread_server_name $upstream_backend { }`
#      block, add the two `app.` / `api.` lines marked ADD below.
#   3. Below the existing `upstream financial_lxc { ... }` block, add the new
#      `upstream camhub_lxc { ... }` block.
#   4. nginx -t && systemctl reload nginx
#
# Public LXC = 10.10.10.99 (same host that runs RDOC-WEBRTC + financial_lxc).
# CamHub's Caddy binds :8443 in that LXC — see docker-compose.prod.yml.

# ---------------------------------------------------------------------------
# 1) Add to the SNI map (inside the existing `map` block):
# ---------------------------------------------------------------------------
#
#     map $ssl_preread_server_name $upstream_backend {
#         ve.raumdock.org              raumdock;
#         minecraft.raumdock.org       minecraft_lxc;
#         ...                                                  (leave existing entries alone)
#         financial.raumdock.org       financial_lxc;
#         app.camhub.raumdock.org      camhub_lxc;   # ADD
#         api.camhub.raumdock.org      camhub_lxc;   # ADD
#         #default                     web_lxc;
#     }

# ---------------------------------------------------------------------------
# 2) Add a new upstream alongside the existing ones:
# ---------------------------------------------------------------------------

    upstream camhub_lxc {
        server 10.10.10.99:8443;
    }

# ---------------------------------------------------------------------------
# Verification (from any internet-facing host, after DNS is in place):
# ---------------------------------------------------------------------------
#
#   openssl s_client -connect api.camhub.raumdock.org:443 \
#                    -servername api.camhub.raumdock.org -showcerts </dev/null
#   # Expect a Let's Encrypt cert for api.camhub.raumdock.org.
#
#   curl -sS https://api.camhub.raumdock.org/healthz | jq
#   # Expect {"status":"ok","db":"ok",...}
#
#   curl -sS -I https://app.camhub.raumdock.org/
#   # Expect 200 (or 302 to login once UI lands in M1).
#
# Rollback (if anything misbehaves):
#   Remove the two ADD lines + the new upstream block, reload nginx.
#   The public LXC's Caddy keeps running on :8443 with no traffic — harmless.
